name: Deploy preview to GitHub Pages
on:
  push:
    branches: [main, claude/fragrance-shop-website-7pzope]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Cache-bust JS/CSS with the commit id
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s#(from '\./[a-z-]+\.js)'#\1?v=$V'#g" js/*.js
          sed -i -E "s#(js/app\.js|css/style\.css)\"#\1?v=$V\"#g" index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: d
        uses: actions/deploy-pages@v4
